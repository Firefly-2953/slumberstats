<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Logs</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" scrollY="true" class="ion-padding">

  <h2>Overnight Logs</h2>
  <ion-list>
    <ion-item *ngFor="let s of allOvernightData">
      <ion-label>
        <h3>{{ s.dateString() }}</h3>
        <p>{{ s.summaryString() }}</p>
      </ion-label>
    </ion-item>
  </ion-list>

  <h2>Sleepiness Logs</h2>
  <ion-list>
    <ion-item *ngFor="let s of allSleepinessData">
      <ion-label>
        <h3>{{ s.dateString() }}</h3>
        <p>{{ s.summaryString() }}</p>
      </ion-label>
    </ion-item>
  </ion-list>

</ion-content>
