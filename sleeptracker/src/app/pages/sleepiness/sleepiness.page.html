<div class="sleep-page">
  <ion-header translucent="true">
    <ion-toolbar>
      <ion-title>SlumberStats</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-content class="ion-padding sleep-bg">
    <div class="page">

      <!-- Log Sleepiness -->
      <ion-card class="glass-card">
        <ion-card-header>
          <ion-card-title>Log Sleepiness</ion-card-title>
        </ion-card-header>

        <ion-card-content>
          <ion-item lines="none" class="sleepiness-row">
            <ion-label>How sleepy are you?</ion-label>
          </ion-item>

          <div class="sleepiness-scale">
            <button
              type="button"
              class="sleepiness-pill"
              *ngFor="let v of [1,2,3,4,5,6,7]"
              [class.selected]="sleepinessValue === v"
              (click)="sleepinessValue = v">
              {{ v }}
            </button>
          </div>

          <div class="sleepiness-selected">
            {{ selectedSleepinessDescription }}
          </div>

          <ion-item lines="full">
            <ion-label>Time</ion-label>
            <ion-button id="open-sleepy-time" fill="clear" slot="end">
              {{ formatDateTime(sleepinessTimeISO) }}
            </ion-button>
          </ion-item>

          <ion-modal trigger="open-sleepy-time" [keepContentsMounted]="true">
            <ng-template>
              <ion-datetime
                presentation="date-time"
                showDefaultButtons="true"
                [(ngModel)]="sleepinessTimeISO">
              </ion-datetime>
            </ng-template>
          </ion-modal>

          <ion-button expand="block" (click)="addSleepinessLog()">
            Save Sleepiness
          </ion-button>
        </ion-card-content>
      </ion-card>

      <!-- Last Check-In -->
      <ion-card class="glass-card" *ngIf="lastSleepinessEntry">
        <ion-card-header>
          <ion-card-title>Last Check-In</ion-card-title>
        </ion-card-header>

        <ion-card-content>
          <ion-item lines="none">
            <ion-label>
              <h2>Level {{ lastSleepinessEntry.getLoggedValue() }}</h2>
              <p>{{ timeAgo(lastSleepinessEntry.loggedAt) }}</p>
            </ion-label>
          </ion-item>

          <ion-item lines="none">
            <ion-label>
              {{ lastSleepinessDescription }}
            </ion-label>
          </ion-item>
        </ion-card-content>
      </ion-card>

    </div>
  </ion-content>
</div>
